<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>GET WEATHER☁️</h1>

        <label for="search"></label>
        <input class="city-search" type="text" name="" id="search" placeholder="Enter city name">
        <button class="search-btn">search</button>


        <img class="image" src="" alt="" srcset="">
        <h2><span class="city-name">.....</span> | <span class="time">.....</span></h2>
        <div class="details">
            <div class="each-measure">
                <p>TEMPERATURE</p>
                <p><span class="temp-value">0</span>&degC</p>
            </div>
            <div class="each-measure">
                <p>FEELS LIKE</p>
                <p><span class="feels-like">0</span>&degC</p>
            </div>
            <div class="each-measure">
                <p>HUMIDITY</p>
                <p><span class="humid-value">0</span> %</p>
            </div>
            <div class="each-measure">
                <p>WIND SPEED</p>
                <p><span class="wind-value">0</span> KMPH</p>
            </div>
        </div>
        <div>
            <p class="weather"></p>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
