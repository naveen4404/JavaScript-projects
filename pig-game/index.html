<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pig-game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="title.PNG" type="image/png">

</head>

<body>
    <div class="title">1 and Done: The Curse of the Dice</div>
    <main>
        <section class="player-0 player-active">
            <div class="player-info">
                <p class="name">PLAYER 1</p>
                <p class="score-0">0</p>
            </div>
            <div>
                <div class="current-box">
                    <p>CURRENT</p>
                    <p class="current-0">0</p>
                </div>
            </div>
        </section>
        <section class="player-1">
            <div class="player-info">
                <p class="name">PLAYER 2</p>
                <p class="score-1">0</p>
            </div>
            <div>
                <div class="current-box">
                    <p>CURRENT</p>
                    <p class="current-1">0</p>
                </div>
            </div>
        </section>
        <img class="dice-display hide-dice" src="" alt="" srcset="">
        <button class="new-game ">🔁 NEW GAME</button>
        <button class="roll-dice">🎲 ROLL</button>
        <button class="hold-btn">📥 Hold</button>
    </main>
    <script src="script.js"></script>
</body>

</html>
