<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login-signup</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="form">
        <div class="select">
            <button class="sign-up">Sign up</button>
            <button class="log-in">Login</button>
        </div>
        <div class="active-check">
            <div class="line"></div>
        </div>
        <input type="text" name="" class="email" placeholder="Email"> <br>
        <input type="text" name="" class="password" placeholder="Password"> <br>
        <button class="done">Sign Up</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
